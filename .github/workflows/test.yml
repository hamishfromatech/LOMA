name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The suite is written to need no network and no models, so we install only
      # what the test modules actually import — not the full runtime stack
      # (faster-whisper, sounddevice and fastmcp are heavy and untested here).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy httpx psutil

      - name: Run the tests
        run: python -m pytest

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests server
