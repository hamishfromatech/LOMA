[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loma"
version = "0.1.0"
description = "LOMA - Local Offline Mini Assistant: faster-whisper STT + Bonsai 2 + Tev1 routing + Phonon TTS, under 3 GB of RAM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hamishfromatech" }]
keywords = ["voice-agent", "offline", "ollama", "whisper", "tts", "stt", "mcp", "needle", "local-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "httpx>=0.27",
    "psutil>=5.9",
    "fastmcp>=4.0",
    "cactus-needle>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
loma = "loma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
